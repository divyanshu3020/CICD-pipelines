name: Passing Variables Between jobs
on:
  workflow_dispatch:

jobs:
  joblove:
    runs-on: ubuntu-24.04
    outputs:
      love: ${{ steps.val-generator.outputs.love }}
    steps:
      - name: Generate and export
        id: val-generator
        run: |
          love=enub
          
          # 1) Step output (for job output)
          echo "love=${love}" >> "$GITHUB_OUTPUT"
          
          # 2) Job-scoped environment variable
          echo "LOVE=${love}" >> "$GITHUB_ENV"

      - name: Inspect values inside producer
        run: |
          echo "LOVE (set via GITHUB_ENV): $LOVE"
          echo "love (step output):       ${{ steps.val-generator.outputs.love }}"

  consumer:
    runs-on: ubuntu-24.04
    needs: joblove
    steps:
      - name: Inspect values inside consumer 
        run: |
          echo "Value from joblove: ${{ needs.joblove.outputs.love }}"
          echo "LOVE (set via GITHUB_ENV): $LOVE"