name: DAG workflow steps

on:
    workflow_dispatch:

jobs:
    job-1:
        runs-on: ubuntu-latest
        steps: 
            - run: echo "hello from step-1"

    job-2:
        runs-on: ubuntu-latest
        steps: 
            - run: echo "hello from step-2"

    job-3:
        runs-on: ubuntu-latest
        needs: 
            - job-1
            - job-2
        steps: 
            - run: echo "hello from step-3 after step 1 and 2 gets done"

    job-4:
        runs-on: ubuntu-latest
        needs: 
            - job-1
            - job-2
        steps: 
            - run: echo "hello from step-4 after step 1 and 2 gets done"
    
    job-5:
        runs-on: ubuntu-latest
        needs: 
            - job-1
            - job-4
        steps: 
            - run: echo "hello from step-5 "

    job-6:
        runs-on: ubuntu-latest
        needs: 
            - job-4
        steps: 
            - run: echo "hello from step-6 "
